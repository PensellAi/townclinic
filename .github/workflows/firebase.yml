# نشر قواعد Firestore (ودالة الإشعارات لو مفعّلة) على Firebase
# محتاج في Settings > Secrets and variables > Actions:
#   Secret  FIREBASE_SERVICE_ACCOUNT : محتوى ملف JSON لحساب الخدمة
#   Variable FIREBASE_PROJECT_ID     : معرّف مشروع Firebase
#   Variable ENABLE_FUNCTIONS        : true بعد تفعيل خطة Blaze (للإشعارات والتطبيق مقفول)
#   Variable ADMIN_URL               : رابط لوحة التحكم، مثلاً https://USER.github.io/REPO/admin/
name: Deploy Firebase (rules + functions)
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "firestore.indexes.json", "functions/**", "firebase.json", ".github/workflows/firebase.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Write service account
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: printf '%s' "$SA" > sa.json
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@13 deploy --only firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Deploy notification functions
        if: ${{ vars.ENABLE_FUNCTIONS == 'true' }}
        run: |
          printf 'ADMIN_URL=%s\n' "${{ vars.ADMIN_URL }}" > functions/.env
          npm install --prefix functions --omit=dev
          npx --yes firebase-tools@13 deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
      - if: always()
        run: rm -f sa.json
